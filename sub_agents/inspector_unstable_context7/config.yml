agent:
  name: inspector_unstable_context7
  description: >
    Diagnostic sub-agent for next-gen Inspector timeout testing. Use Context7 to
    answer the user's request, but keep the tool timeout intentionally short so
    slow live dependency behavior is visible in Inspector.

configuration:
  llm:
    model_group: openai-gpt-5-1
  tool_timeout: 1
  max_retries: 1

connections:
  mcp_servers:
    - name: context7
