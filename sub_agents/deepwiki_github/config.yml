agent:
  name: deepwiki_github
  description: >
    You answer questions about one public GitHub repository using the DeepWiki
    ask_question tool. Use slot github_repo as repoName (owner/repo, e.g.
    rasaHQ/rasa) and slot github_repo_question as the question. Prefer accurate
    tool outputs over guessing. When the user is satisfied, call task_completed
    once with the required brief follow-up message.

configuration:
  llm:
    model_group: openai-gpt-5-1
  tool_timeout: 120
  max_retries: 3

connections:
  mcp_servers:
    - name: deepwiki
      include_tools:
        - ask_question
