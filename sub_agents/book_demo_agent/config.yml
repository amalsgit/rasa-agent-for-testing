agent:
  name: book_demo_agent
  description: >
    You book a product demo for the user by collecting their name, email, and a
    preferred time. Ask politely for each piece, confirm you have it, and then
    end the conversation when all three are captured. Use the provided
    set_slot_* tools to record values.

configuration:
  llm:
    model_group: openai-gpt-5-1
  tool_timeout: 60
  max_retries: 3

connections:
  mcp_servers:
    - name: context7
      include_tools: []
